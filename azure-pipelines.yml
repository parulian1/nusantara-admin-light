trigger:
  - release/*
  - hotfix/*
  
pool:
  vmImage: ubuntu-20.04

variables:
  - group: nusantara-web-pipeline-build

  # Don't forget add trailing slash ('/').
  - name: BUILD_DEST_PATH
    value: dist/nusantara-admin

resources:
  repositories:
    - repository: templates
      type: git
      name: Operations/pipeline-templates

jobs:
  - job: unit_test
    displayName: Run Unit Test
    steps:
      # https://dev.azure.com/gramediadigital/Operations/_git/pipeline-templates?path=%2Fweb%2Funit_test.yml
      - template: web/unit_test.yml@templates
        parameters:
          feedId: $(FEED_ID)
          testArgs: ''

  - job: build_prod
    displayName: Build & Packaging PROD
    dependsOn: unit_test
    condition: |
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    steps:
      # https://dev.azure.com/gramediadigital/Operations/_git/pipeline-templates?path=%2Fweb%2Fbuild.yml
      - template: web/build.yml@templates
        parameters:
          appEnv: production
          feedId: $(FEED_ID)
          buildPath: $(BUILD_DEST_PATH)
          envVars: 'APM_NAME=$(Build.Repository.Name) APM_ACTIVE=True APM_ENVIRONMENT=production APM_URL=$(APM_URL)'

  # Staging Build
  - job: build_staging
    displayName: Build & Packaging STAGING
    dependsOn: unit_test
    condition: |
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    steps:
      - template: web/build.yml@templates
        parameters:
          feedId: $(FEED_ID)
          buildPath: $(BUILD_DEST_PATH)
          envVars: 'APM_NAME=$(Build.Repository.Name) APM_ACTIVE=False APM_ENVIRONMENT=staging APM_URL=$(APM_URL)'
