      - task: Bash@3
        displayName: Compare with master branch
        inputs:
          targetType: 'inline'
          script: |
            awk '{sub(/BUILD_PATH/,$BUILD_DEST_PATH); print . "Dockerfile" }' Dockerfile
            cat Dockerfile

