trigger:
  - release/*
  - hotfix/*
  - master

pool:
  vmImage: ubuntu-20.04

variables:
  - group: nusantara-web-pipeline-build

  # Don't forget add trailing slash ('/').
  - name: BUILD_DEST_PATH
    value: dist/nusantara-admin

  - name: APM_NAME
    value: web-admin

  # runtime variables, automatically defined by agent when pipeline running
  - name: IS_NON_MASTER_BRANCH
    value: $[ne(variables['Build.SourceBranch'], 'refs/heads/master')]

resources:
  repositories:
    - repository: templates
      type: git
      name: Operations/pipeline-templates

