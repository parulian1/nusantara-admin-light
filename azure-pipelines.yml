trigger:
  - release/*
  - hotfix/*
  - master

pool:
  vmImage: ubuntu-20.04

variables:
  - group: nusantara-web-pipeline-build
  - group: Aws-Programatic

  # Don't forget add trailing slash ('/').
  - name: BUILD_DEST_PATH
    value: dist/nusantara-admin

  - name: APM_NAME
    value: web-admin

  - name: DOCKER_REPO
    value: gramedia/nginx

  # runtime variables, automatically defined by agent when pipeline running
  - name: IS_NON_MASTER_BRANCH
    value: $[ne(variables['Build.SourceBranch'], 'refs/heads/master')]

resources:
  repositories:
    - repository: templates
      type: git
      name: Operations/pipeline-templates

jobs:
  - job: unit_test
    displayName: Run Unit Test
    steps:
      # https://dev.azure.com/gramediadigital/Operations/_git/pipeline-templates?path=%2Fweb%2Funit_test.yml
      - template: web/unit_test.yml@templates
        parameters:
          feedId: $(FEED_ID)
          testArgs: '--source-map --code-coverage'

  # prod build
  - job: build_prod
    dependsOn: unit_test
    pool:
      name: docker-agent
    displayName: Build & Packaging PROD
    condition: |
      and(
        succeeded(),
        eq('True', variables.IS_NON_MASTER_BRANCH),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    steps:
      # https://dev.azure.com/gramediadigital/Operations/_git/pipeline-templates?path=%2Fweb%2Fbuild.yml
      - template: web/build.yml@templates
        parameters:
          appEnv: production
          feedId: $(FEED_ID)
          buildPath: $(BUILD_DEST_PATH)
          envVars: 'APM_NAME=$(APM_NAME) APM_ACTIVE=True APM_ENVIRONMENT=production APM_URL=$(APM_URL)'
          buildCommand: 'build:prod'
          buildArgs: '--localize'
          postBuildScript: |
            tee $(BUILD_DEST_PATH)/index.html << EOF
            <!DOCTYPE html><html><head><meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><title>Nusantara Admin</title><script type="type/javascript">const lang=navigator.language||navigator.browserLanguage;if(lang.includes("id")){window.location.href="/id/";}else{window.location.href="/en/";}</script></head><body></body></html>
            EOF

      - task: ECRPullImage@1
        displayName: Pull base image
        inputs:
          awsCredentials: 'Aws-Ecs (New Account)'
          regionName: 'ap-southeast-1'
          repository: 'gramedia/nginx'
          imageSource: 'imagetag'
          imageTag: 'gramedia.io'

      - task: Docker@2
        displayName: Docker Build
        inputs:
          repository: $(DOCKER_REPO)
          command: build
          tags: |
            $(Build.BuildId)

      - task: ECRPushImage@1
        displayName: Docker Push to ECR (Version Tags)
        inputs:
          awsCredentials: $(AWS_CREDENTIAL_NAME)
          regionName: $(AWS_REGION)
          sourceImageName: $(DOCKER_REPO)
          sourceImageTag: '$(Build.BuildId)'
          repositoryName: $(DOCKER_REPO)
          pushTag: admin-$(Build.SourceBranchName)
          autoCreateRepository: true

      - task: ECRPushImage@1
        displayName: Docker Push to ECR (Version Tags)
        inputs:
          awsCredentials: $(AWS_CREDENTIAL_NAME)
          regionName: $(AWS_REGION)
          sourceImageName: $(DOCKER_REPO)
          sourceImageTag: '$(Build.BuildId)'
          repositoryName: $(DOCKER_REPO)
          pushTag: admin-latest
          autoCreateRepository: true

  # Staging Build
  - job: build_staging
    dependsOn: unit_test
    pool:
      name: docker-agent
    displayName: Build & Packaging STAGING
    condition: |
      and(
        succeeded(),
        eq('True', variables.IS_NON_MASTER_BRANCH),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    steps:
      - template: web/build.yml@templates
        parameters:
          feedId: $(FEED_ID)
          buildPath: $(BUILD_DEST_PATH)
          envVars: 'APM_NAME=$(APM_NAME) APM_ACTIVE=False APM_ENVIRONMENT=staging APM_URL=$(APM_URL)'

      - task: ECRPullImage@1
        displayName: Pull base image
        inputs:
          awsCredentials: 'Aws-Ecs (New Account)'
          regionName: 'ap-southeast-1'
          repository: 'gramedia/nginx'
          imageSource: 'imagetag'
          imageTag: 'gramedia.io'

      - task: Docker@2
        displayName: Docker Build
        inputs:
          repository: $(DOCKER_REPO)
          command: build
          tags: |
            $(Build.BuildId)

      - task: ECRPushImage@1
        displayName: Docker Push to ECR (Version Tags)
        inputs:
          awsCredentials: $(AWS_CREDENTIAL_NAME)
          regionName: $(AWS_REGION)
          sourceImageName: $(DOCKER_REPO)
          sourceImageTag: '$(Build.BuildId)'
          repositoryName: $(DOCKER_REPO)
          pushTag: admin-$(Build.SourceBranchName)
          autoCreateRepository: true

      - task: ECRPushImage@1
        displayName: Docker Push to ECR (Version Tags)
        inputs:
          awsCredentials: $(AWS_CREDENTIAL_NAME)
          regionName: $(AWS_REGION)
          sourceImageName: $(DOCKER_REPO)
          sourceImageTag: '$(Build.BuildId)'
          repositoryName: $(DOCKER_REPO)
          pushTag: admin-dev
          autoCreateRepository: true
