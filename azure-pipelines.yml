  # Staging Build
  - job: build_staging
    # dependsOn: build_prod
    pool:
      name: docker-agent
    displayName: Build & Packaging STAGING
    condition: |
      and(
        succeeded(),
        eq('True', variables.IS_NON_MASTER_BRANCH),
        ne(variables['Build.Reason'], 'PullRequest')
      )
