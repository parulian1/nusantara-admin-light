<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bhisma Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    .spinner { margin: 20px auto; width: 50px; height: 40px; text-align: center; font-size: 10px; }
    .spinner > div {
      background-color: #f27720;
      height: 100%; width: 6px;
      display: inline-block;
      animation: sk-stretchdelay 1.2s infinite ease-in-out;
    }
    .spinner .rect2 { animation-delay: -1.1s; }
    .spinner .rect3 { animation-delay: -1.0s; }
    .spinner .rect4 { animation-delay: -0.9s; }
    .spinner .rect5 { animation-delay: -0.8s; }
    @keyframes sk-stretchdelay { 0%, 40%, 100% { transform: scaleY(0.4); } 20% { transform: scaleY(1.0); } }

    #preload-animation {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-color: #485368;
      display: grid;
      grid-template-columns: 1fr 500px 1fr;
      grid-template-rows: 1fr auto 1fr;
      min-height: 100vh;
    }
    .fadeout { transition: opacity .7s; opacity: 0; }

    .spin-container {
      grid-column: 2;
      grid-row: 2;
      text-align: center;
      color: white;
    }
    .spin-container > img {
      grid-column: 1/3;
      display: inherit;
      margin: 60px auto 20px;
    }

  </style>
</head>
<body>
  <nus-root></nus-root>
  <div id="preload-animation">
    <div class="spin-container">
      <img src="assets/bhisma-logo.png">
      <div class="spinner">
        <div class="rect1"></div>
        <div class="rect2"></div>
        <div class="rect3"></div>
        <div class="rect4"></div>
        <div class="rect5"></div>
      </div>
      <p>Kami hampir siap, harap tunggu!</p>
    </div>
  </div>
</body>
</html>
